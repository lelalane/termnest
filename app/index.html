<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TermNest Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Palette: University of Miami green and orange, off-white, near black.
   Contrast: #fff on #005030 ≈ 9.6:1 · #005030 on #fff ≈ 10:1 · #1A1A1A on #F47321 ≈ 6:1.
   Rules: orange is only a fill for badges, highlights and small accents, always with near-black text/icons.
   Never white text on orange; never orange text on white (≈ 2.9:1). */
:root{
  --green:#005030; --green-dark:#003A22; --green-text:#005030; --green-50:#E6F0EA;
  --orange:#F47321; --orange-50:#FEF0E6; --bg:#FAFAF7;
  --ink:#1A1A1A; --ink-2:#474C49; --muted:#474C49; --line:#1A1A1A; --soft:#D6DDD8;
  --danger:#B3261E; --heart:var(--green); --s:1;   /* red is kept only for errors and Log out */
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --head:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:18px}
html.lg{font-size:21px}
body{margin:0;min-height:100vh;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;color:var(--ink);
  background:#E8EEEA;display:flex;align-items:center;justify-content:center;gap:56px;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3,.logo,.price strong,.price-lg strong,.ab-price strong,.range-val,.avatar,.avatar-lg{font-family:var(--head);letter-spacing:-.015em}
h1{font-weight:800}
h2,h3{font-weight:700}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--green-text);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- page notes (desktop only) ---------- */
.notes{max-width:300px;font-size:16px;line-height:1.5}
.notes h2{font-size:30px;margin:14px 0 6px;font-weight:800}
.notes ol{padding-left:20px;margin:12px 0}
.notes .restart{margin-top:8px;min-height:48px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:700;box-shadow:var(--shadow-sm)}
@media (max-width:1000px){.notes{display:none}}

/* ---------- phone frame ---------- */
.stage{width:calc(414px * var(--s));height:calc(868px * var(--s));flex:none}
.phone{width:414px;height:868px;transform:scale(var(--s));transform-origin:top left;border-radius:66px;background:#151515;padding:12px;
  box-shadow:0 0 0 2px #3a3a3a,0 30px 60px rgba(0,40,24,.3),inset 0 0 0 2px #222;position:relative}
.glass{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:80}
.statusbar{height:54px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0 40px;font-weight:700;font-size:16px;background:var(--bg);color:var(--ink);z-index:40}
.statusbar.dark{background:var(--green);color:#fff}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%);z-index:90;pointer-events:none}
#app{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--bg);scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.endspace{height:36px}

/* ---------- tab bar: floating shipping label ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;margin:0 12px 26px;background:#fff;border:2px solid var(--ink);border-radius:20px;
  box-shadow:var(--shadow);padding:6px 2px;z-index:30;position:relative}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:none;
  font-size:min(.76rem,14.5px);font-weight:700;color:var(--ink-2);border-radius:12px;position:relative;padding:0}
.tab-ic{width:50px;height:32px;border-radius:9px;display:grid;place-items:center;border:2px solid transparent}
.tab[aria-current="page"]{color:var(--green-text)}
.tab[aria-current="page"] .tab-ic{background:var(--green);color:#fff;border-color:var(--ink);transform:rotate(-3deg)}
.tab[aria-current="page"]::after{content:"";position:absolute;bottom:-4px;left:28%;right:28%;height:3px;border-radius:2px;background:var(--green-text)}
.tab.post .tab-ic{width:56px;height:52px;margin-top:-26px;background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:12px;
  box-shadow:var(--shadow-sm);transform:rotate(-4deg)}
.tab.post[aria-current="page"] .tab-ic{transform:rotate(3deg)}
.tab.post[aria-current="page"]::after{display:none}
.count{position:absolute;top:0;left:calc(50% + 8px);background:var(--orange);color:var(--ink);font-size:13px;font-weight:800;min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;padding:0 6px;border:2px solid var(--ink)}

/* ---------- generic ---------- */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 20px 12px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:1.6rem;line-height:1.15}
.eyebrow{font-size:.9rem;color:var(--green-text);font-weight:700}
.icon-btn{width:52px;height:52px;flex:none;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.icon-btn:active,.btn:active,.chip:active,.save-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:12px;font-size:1rem;font-weight:700;
  border:2px solid var(--ink);padding:0 18px;text-align:center;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn+.btn{margin-top:14px}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-accent{background:var(--orange);color:var(--ink)}
.btn-ghost{background:#fff;color:var(--ink)}
.link{background:none;border:0;color:var(--green-text);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;min-height:48px;padding:0 6px}
.verified{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--green-text);font-weight:700;font-size:.85rem;padding:5px 11px;border-radius:6px;border:2px dashed var(--green-text)}
.meta{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:.9rem}
.protect{display:flex;gap:12px;background:var(--orange-50);border:2px solid var(--ink);border-radius:12px;padding:14px;font-size:.92rem;line-height:1.45;color:var(--ink);position:relative;border-left:10px solid var(--green)}
.protect svg{flex:none;color:var(--green-text)}
.protect strong{display:block;margin-bottom:2px;font-size:1rem;font-family:var(--head)}
.empty{text-align:center;padding:40px 24px}
.empty .big-ic,.mail-ill,.success .big-ic{border:2px solid var(--ink);box-shadow:var(--shadow);border-radius:18px;transform:rotate(-4deg);
  background:var(--orange);color:var(--ink)}
.empty .big-ic{width:96px;height:96px;display:grid;place-items:center;margin:0 auto 22px}
.empty h2{font-size:1.3rem;margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:22px;line-height:1.45}

/* ---------- forms ---------- */
.form h2{font-size:1.35rem;margin:24px 0 14px}
.field{margin-bottom:18px}
.field label,.legend{display:block;font-weight:700;margin-bottom:6px;font-size:1rem}
.field input,.field select,.field textarea{width:100%;min-height:56px;border:2px solid var(--ink);border-radius:10px;padding:12px 14px;font-size:1rem;background:#fff}
.field textarea{min-height:110px;resize:vertical;line-height:1.4}
.field input::placeholder,.field textarea::placeholder{color:#5E6561}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px;box-shadow:var(--shadow-sm)}
.field [aria-invalid="true"]{border-color:var(--danger);background:#FFF5F4}
.help{font-size:.85rem;color:var(--ink-2);margin-top:6px;line-height:1.4}
.error{font-size:.9rem;color:var(--danger);font-weight:700;margin-top:6px}
.error:empty{display:none}
.error::before{content:"⚠ "}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0 0 18px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;border:2px solid var(--ink);border-radius:10px;padding:0 14px;margin-bottom:10px;font-weight:700;cursor:pointer;background:#fff}
.opt input{width:24px;height:24px;accent-color:var(--green);margin:0}
.opt:has(input:checked){background:var(--green-50);box-shadow:var(--shadow-sm)}
.opt:has(input:focus-visible){outline:3px solid var(--green-text);outline-offset:2px}
.err-summary{background:#FFF5F4;border:2px solid var(--danger);border-radius:10px;padding:14px;margin:6px 0 18px}
.err-summary h2{font-size:1rem;margin:0 0 6px;color:var(--danger)}
.err-summary ul{margin:0;padding-left:20px}
.err-summary button{background:none;border:0;color:var(--danger);text-decoration:underline;font-weight:700;padding:4px 0;min-height:44px;text-align:left}

/* ---------- welcome hero ---------- */
.hero{background:var(--green);color:#fff;padding:12px 24px 30px;border-bottom:6px solid var(--orange);position:relative}
.hero h1{font-size:1.85rem;line-height:1.1;margin:20px 0 10px}
.hero p{font-size:1rem;line-height:1.45}
.props{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.props li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:.95rem;line-height:1.3;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 12px}
.props svg{flex:none;color:var(--green-text)}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.4rem}
.switch-mode{text-align:center;margin-top:16px;color:var(--ink-2)}
.mail-ill{width:88px;height:88px;display:grid;place-items:center;margin:16px 0 22px}
.code-input{letter-spacing:.5em;font-size:1.4rem!important;text-align:center;font-weight:700}

/* ---------- home ---------- */
.search{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:12px;padding:0 14px;min-height:58px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow-sm)}
.search:focus-within{outline:3px solid var(--green);outline-offset:2px}
.search input{flex:1;border:0;min-height:54px;font-size:1rem;background:none;min-width:0}
.search input:focus-visible{outline:none}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;min-height:48px;padding:0 14px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-size:.9rem;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none;box-shadow:2px 2px 0 var(--ink)}
.chip.on{background:var(--green);color:#fff}
.result-count{font-weight:700;margin:8px 0 14px;color:var(--ink-2)}
.cards{list-style:none;margin:0;padding:0 4px 0 0;display:grid;gap:22px}
.card{position:relative;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
/* listing photos (sample photos from ../images) */
.photo{position:relative;height:170px;overflow:hidden;background:var(--green-50);border-bottom:2px solid var(--ink)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sample-tag{position:absolute;left:10px;bottom:10px;z-index:1;background:rgba(255,255,255,.94);color:var(--ink);font-size:.75rem;font-weight:700;line-height:1;padding:5px 8px;border:1.5px solid var(--ink);border-radius:6px;pointer-events:none}
.thumb{overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pill{position:absolute;top:14px;left:-6px;z-index:1;background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;padding:6px 12px 6px 16px;display:inline-flex;gap:5px;align-items:center;transform:rotate(-4deg);border-radius:2px}
.card-body{padding:14px 16px 16px}
.card h3{font-size:1.2rem;margin-bottom:6px;line-height:1.2;padding-right:4px}
.card-link{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink);font-family:var(--head)}
.card-link::after{content:"";position:absolute;inset:0;border-radius:12px}
.card-link:focus-visible{outline:none}
.card-link:focus-visible::after{outline:4px solid var(--green);outline-offset:-6px}
.mini-dates{display:grid;grid-template-columns:1fr 1fr;margin:12px 0;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.mini-dates div{padding:8px 10px;background:var(--bg)}
.mini-dates div+div{border-left:2px dashed var(--ink)}
.mini-dates dt{font-size:.75rem;font-weight:700;color:var(--green-text);text-transform:uppercase;letter-spacing:.06em}
.mini-dates dd{margin:2px 0 0;font-weight:700;font-size:.95rem}
.price{font-size:1rem}
.price strong{font-size:1.35rem;font-weight:800}
.save-btn{position:absolute;top:10px;right:10px;z-index:2;width:52px;height:52px;border-radius:12px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow-sm)}
.save-btn[aria-pressed="true"],.icon-btn[aria-pressed="true"]{color:var(--heart)}
[aria-pressed="true"] .heart{fill:currentColor}

/* ---------- detail ---------- */
.gallery{position:relative}
.gallery .photo{height:280px}
.gallery .sample-tag{left:14px;bottom:14px}
.gallery .float{position:absolute;top:14px;z-index:2}
.gallery .float.l{left:14px}.gallery .float.r{right:14px}
.ph-label{position:absolute;bottom:14px;right:14px;transform:rotate(-2deg);background:#fff;color:var(--ink);font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:6px;border:2px solid var(--ink);white-space:nowrap}
.gal-nav{position:absolute;inset:auto 14px 50% 14px;display:flex;justify-content:space-between;transform:translateY(50%);pointer-events:none}
.gal-nav button{pointer-events:auto;width:48px;height:48px;border-radius:12px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.detail-body{padding:18px 20px 8px}
.detail-body h1{font-size:1.7rem;line-height:1.12;margin:14px 0 6px}
.price-lg{font-size:1rem;margin:12px 0 16px}
.price-lg strong{font-size:1.9rem;font-weight:800}
.date-box{border:2px solid var(--ink);border-radius:12px;margin-bottom:18px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.date-box .cols{display:grid;grid-template-columns:1fr 1fr;align-items:start}
.date-box .cols>div{padding:12px 14px}
.date-box .cols>div+div{border-left:2px dashed var(--ink)}
.date-box .lbl{font-size:.8rem;font-weight:700;color:var(--green-text);text-transform:uppercase;letter-spacing:.06em}
.date-box .val{font-weight:700;font-size:1.05rem;margin-top:2px;font-family:var(--head)}
.date-box .wd{font-size:.85rem;color:var(--ink-2)}
.date-box .dur{padding:10px 14px;border-top:2px solid var(--ink);background:var(--green-50);color:var(--ink);font-size:.92rem;font-weight:700}
.section-h{font-size:1.25rem;margin:24px 0 8px}
.desc{line-height:1.5}
.facts{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts li{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px;font-size:.9rem;font-weight:700}
.facts svg{color:var(--green-text);flex:none}
.host{display:flex;gap:14px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:14px;margin-bottom:16px;background:#fff}
.avatar{width:52px;height:52px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;border:2px solid var(--ink)}
.avatar.y{background:var(--orange);color:var(--ink)}
.host p{font-size:.9rem;color:var(--ink-2);line-height:1.35}
.host strong{font-size:1.05rem;color:var(--ink)}
.action-bar{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--ink);padding:14px 20px 32px;display:flex;gap:14px;align-items:center;z-index:4}
.action-bar .btn{width:auto;flex:1}
.ab-price strong{font-size:1.3rem;font-weight:800}
.ab-sub{font-size:.8rem;color:var(--ink-2);font-weight:700}

/* ---------- messages ---------- */
.threads{list-style:none;margin:0;padding:0 16px;display:grid;gap:12px}
.thread{width:100%;display:flex;gap:14px;align-items:center;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:12px 14px;min-height:84px}
.thread.unread{box-shadow:var(--shadow);border-left:10px solid var(--orange)}
.t-main{flex:1;min-width:0;display:grid;gap:2px}
.t-top{display:flex;justify-content:space-between;gap:8px}
.t-top strong{font-family:var(--head)}
.t-time{font-size:.8rem;color:var(--ink-2)}
.t-listing{font-size:.82rem;color:var(--green-text);font-weight:700}
.t-prev{font-size:.9rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread.unread .t-prev{color:var(--ink);font-weight:700}
.dot{width:14px;height:14px;border-radius:4px;background:var(--orange);border:2px solid var(--ink);flex:none}
.chat-head{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;padding:6px 16px 12px;border-bottom:2px solid var(--ink)}
.chat-head h1{font-size:1.2rem}
.chat-head .verified{font-size:.75rem;padding:2px 8px;margin-top:3px}
.chat-listing{display:flex;gap:12px;align-items:center;width:calc(100% - 32px);margin:14px 16px 0;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px;text-align:left;min-height:64px;box-shadow:var(--shadow-sm)}
.chat-listing .thumb{width:48px;height:48px;border-radius:8px;flex:none;display:grid;place-items:center;border:2px solid var(--ink)}
.chat-listing span{display:block;font-size:.85rem;color:var(--ink-2)}
.chat-listing strong{display:block;font-size:.95rem;color:var(--ink)}
.chat-listing .grow{flex:1;min-width:0}
.log{list-style:none;margin:0;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:250px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.4;font-size:.98rem;border:2px solid var(--ink)}
.msg.them{background:#fff;align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;box-shadow:3px 3px 0 var(--ink)}
.msg .time{display:block;font-size:.72rem;margin-top:4px}
.quick{display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.quick .chip{font-size:.85rem}
.composer{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--ink);display:flex;gap:10px;padding:10px 16px 32px}
.composer input{flex:1;min-height:52px;border:2px solid var(--ink);border-radius:12px;padding:0 16px;font-size:1rem;min-width:0;background:#fff}
.composer input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.send{width:52px;height:52px;border-radius:12px;border:2px solid var(--ink);background:var(--green);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}

/* ---------- profile ---------- */
.profile-head{text-align:center;padding:16px 20px 22px;background:var(--green-50);border-bottom:2px solid var(--ink)}
.avatar-lg{width:92px;height:92px;font-size:2.2rem;margin:0 auto 12px;background:var(--green);color:#fff;border-radius:18px;display:grid;place-items:center;font-weight:800;border:2px solid var(--ink);box-shadow:var(--shadow);transform:rotate(-4deg)}
.profile-head h1{font-size:1.6rem}
.profile-head p{color:var(--ink);margin:4px 0 10px;word-break:break-all}
.menu{list-style:none;margin:0;padding:0 16px;display:grid;gap:10px}
.menu-h{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--green-text);margin:26px 20px 10px;font-family:'Atkinson Hyperlegible',sans-serif}
.menu-item{width:100%;display:flex;align-items:center;gap:14px;min-height:68px;border:2px solid var(--ink);border-radius:12px;background:#fff;text-align:left;padding:8px 12px;font-weight:700;font-size:1rem}
.menu-item .mi-ic{width:44px;height:44px;border-radius:10px;background:var(--green-50);color:var(--green-text);display:grid;place-items:center;flex:none;border:2px solid var(--ink)}
.menu-item .mi-text{flex:1}
.menu-item small{display:block;font-weight:400;color:var(--ink-2);font-size:.82rem;margin-top:2px}
.menu-item.danger{color:var(--danger)}
.menu-item.danger .mi-ic{background:#FCEBEA;color:var(--danger)}
.toggle{width:58px;height:34px;border-radius:8px;background:#fff;border:2px solid var(--ink);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:5px;background:var(--ink);transition:left .2s}
[aria-checked="true"] .toggle{background:var(--green)}
[aria-checked="true"] .toggle::after{left:27px;background:#fff;box-shadow:0 0 0 2px var(--ink)}
.fine{text-align:center;color:var(--ink-2);font-size:.85rem;margin:20px 0}

/* ---------- success ---------- */
.success{text-align:center;padding:44px 24px}
.success .big-ic{width:110px;height:110px;display:grid;place-items:center;margin:0 auto 24px}
.success h1{font-size:1.8rem;margin-bottom:10px}
.success p{color:var(--ink-2);line-height:1.5;margin-bottom:24px}

/* ---------- sheet ---------- */
#sheetRoot{position:absolute;inset:0;z-index:70}
.scrim{position:absolute;inset:0;background:rgba(26,26,26,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-top:2px solid var(--ink);border-radius:22px 22px 0 0;padding:10px 20px 36px;transform:translateY(100%);transition:transform .25s ease}
#sheetRoot.open .sheet{transform:none}
.grab{width:56px;height:8px;border-radius:2px;background:var(--orange);border:2px solid var(--ink);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet-head h2{font-size:1.45rem;font-weight:800}
.sheet-sub{color:var(--ink-2);margin:-6px 0 14px}
.sheet .section-h:first-of-type{margin-top:6px}
.summary{margin:0 0 18px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:2px dashed var(--soft)}
.summary div:last-child{border-bottom:0;border-top:2px solid var(--ink);background:var(--orange-50)}
.summary div:last-child dt{color:var(--ink);font-weight:700}
.summary dt{color:var(--ink-2)}
.summary dd{margin:0;font-weight:700;text-align:right}
.steps{padding-left:22px;line-height:1.5;margin:0 0 16px}
.steps li{margin-bottom:10px}
input[type=range]{width:100%;height:44px;accent-color:var(--green)}
.range-val{font-size:1.5rem;font-weight:800;color:var(--green-text)}
.range-ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-2)}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:8px;position:sticky;bottom:-36px;background:var(--bg);padding:12px 4px 8px 0}
.sheet-actions .btn+.btn{margin-top:0}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:122px;transform:translateX(-50%) rotate(-1deg);background:var(--ink);color:#fff;font-weight:700;padding:12px 18px;border-radius:10px;border-left:8px solid var(--orange);z-index:75;max-width:330px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- photos ---------- */
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.photo-grid .thumb{width:70px;height:70px;border-radius:10px;display:grid;place-items:center;border:2px solid var(--ink)}
.photo-grid .thumb::before,.chat-listing .thumb::before{display:none}
/* ---------- roommate match ---------- */
.match{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:0 12px;border:2px solid var(--ink);border-radius:8px;font-size:.9rem;font-weight:700;color:var(--ink);background:#fff;box-shadow:2px 2px 0 var(--ink)}
.match strong{font-family:var(--head);font-size:1.05rem}
.match.high{background:var(--green);color:#fff}
.match.mid{background:var(--orange)}
.match.low{border-style:dashed}
.match.static{min-height:0;margin:0 6px 0 0;padding:2px 8px;box-shadow:none;font-size:.82rem;vertical-align:middle}
.match-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:#fff;box-shadow:var(--shadow);min-height:76px}
.match-card .pct{font-family:var(--head);font-weight:800;font-size:1.6rem;min-width:76px;height:52px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;transform:rotate(-3deg);background:#fff}
.match-card.high .pct{background:var(--green);color:#fff}
.match-card.mid .pct{background:var(--orange)}
.match-card.low .pct{border-style:dashed}
.match-card .grow{flex:1}
.match-card strong{display:block;font-family:var(--head);font-size:1.05rem}
.match-card .grow span{display:block;font-size:.88rem;color:var(--ink-2)}
.m-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.m-row{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:10px;background:#fff}
.m-row .grow{flex:1;min-width:0}
.m-row strong{display:block;font-family:var(--head)}
.m-row .grow span{display:block;font-size:.85rem;color:var(--ink-2);line-height:1.35}
.m-ic{width:40px;height:40px;flex:none;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--bg)}
.m-tag{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:.78rem;font-weight:700;padding:3px 7px;border-radius:5px;border:2px solid var(--ink)}
.m-row.s-match .m-tag{background:var(--green);color:#fff}
.m-row.s-close .m-tag{background:var(--orange)}
.m-row.s-diff{border-style:dashed}
.m-row.s-diff .m-tag{background:#fff;color:var(--ink);border-style:dashed}

/* ---------- preferences, banner, sort ---------- */
.opt-tag{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:6px;border:2px solid var(--ink);background:var(--orange);color:var(--ink)}
.pref-q{margin:0;padding:16px 0;border-bottom:2px dashed var(--soft)}
.pref-q legend{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;font-size:1.1rem;padding:0;margin-bottom:10px}
.pref-q legend svg{color:var(--green)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill-opt{position:relative;cursor:pointer}
.pill-opt input{position:absolute;opacity:0;width:1px;height:1px}
.pill-opt span{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:.95rem}
.pill-opt input:checked+span{background:var(--green);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.pill-opt input:checked+span::before{content:"✓";margin-right:6px}
.pill-opt input:focus-visible+span{outline:3px solid var(--green);outline-offset:3px}
.pill-opt.none span{border-style:dashed;font-weight:400;color:var(--ink-2)}
.pill-opt.none input:checked+span{background:var(--soft);color:var(--ink);font-weight:700}
.pref-actions{margin-top:22px}
.pref-banner{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin:6px 4px 10px 0;padding:14px;background:var(--orange-50);border:2px solid var(--ink);border-left:10px solid var(--orange);border-radius:12px}
.pref-banner p{font-weight:700;line-height:1.35}
.pref-banner .pb-ic{width:44px;height:44px;border-radius:10px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;color:var(--green)}
.pref-banner .btn{grid-column:1/-1;min-height:52px;box-shadow:var(--shadow-sm)}
.sort{border:0;margin:6px 0 0;padding:0}
.sort legend{font-weight:700;font-size:.9rem;color:var(--ink-2);margin-bottom:6px;padding:0}
.sort .pills{padding:2px 4px 4px 2px}
.sort .pill-opt span{white-space:nowrap;min-height:44px;font-size:.88rem}
.pref-nudge{width:100%;display:flex;align-items:center;gap:12px;text-align:left;margin:0 0 16px;padding:12px 14px;min-height:64px;border:2px dashed var(--ink);border-radius:12px;background:var(--orange-50);font-weight:700;line-height:1.35}
.pref-nudge span{flex:1}
.pref-nudge.info{background:#fff;font-weight:400;color:var(--ink-2)}
.pref-nudge svg:first-child{color:var(--green);flex:none}

/* ---------- landlord approval ---------- */
.step-of{font-size:.85rem;font-weight:700;color:var(--green-text);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.ll-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
.ll-steps li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.85rem;font-weight:700;color:var(--ink-2);position:relative}
.ll-steps li:not(:last-child)::after{content:"";position:absolute;top:20px;left:calc(50% + 24px);right:calc(-50% + 24px);height:4px;border-radius:2px;background:var(--soft)}
.ll-steps li.done:not(:last-child)::after{background:var(--green)}
.ll-steps .mark{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--head);font-weight:800;background:#fff}
.ll-steps .done{color:var(--ink)}
.ll-steps .done .mark{background:var(--green);color:#fff}
.ll-steps .now{color:var(--ink)}
.ll-steps .now .mark{background:var(--orange);transform:rotate(-4deg);box-shadow:var(--shadow-sm)}
.ll-steps .todo .mark{border-style:dashed;color:var(--ink-2)}
.ll-now{margin:16px 0 14px;font-weight:700}
.ll-chip{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:6px;border:2px solid var(--ink);background:#fff;color:var(--ink);white-space:nowrap}
.ll-chip.none{border-style:dashed;color:var(--ink-2)}
.ll-chip.requested{background:var(--orange)}
.ll-chip.approved{background:var(--green);color:#fff}
.ll-card{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--ink);border-radius:12px;padding:14px;line-height:1.4}
.ll-card svg{flex:none}
.ll-card strong{display:block;font-family:var(--head);font-size:1.05rem}
.ll-card span{display:block;font-size:.9rem;color:var(--ink-2)}
.ll-card.requested{background:var(--orange-50);border-left:10px solid var(--orange)}
.ll-card.approved{background:var(--green-50);border-left:10px solid var(--green)}
.ll-card.approved svg{color:var(--green)}
.ll-row{width:100%;display:flex;align-items:center;gap:10px;margin-top:12px;min-height:52px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);font-weight:700;text-align:left}
.ll-row>span:first-of-type{flex:1}
.ll-row svg:first-child{color:var(--green)}
.req .req-agr{margin-top:10px}

/* ---------- sublease agreement ---------- */
.agr-banner{display:flex;gap:12px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin:4px 4px 16px 0;line-height:1.35}
.agr-banner svg{flex:none}
.agr-banner strong{display:block;font-family:var(--head);font-size:1.1rem}
.agr-banner span{font-size:.88rem}
.agr-banner.done{background:var(--green);color:#fff}
.agr-banner.wait,.agr-banner.ready{background:var(--orange-50);border-left:10px solid var(--orange)}
.agr-banner.block{background:#fff;border-style:dashed}
.agr-doc{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:18px 16px;box-shadow:var(--shadow);margin-right:4px}
.agr-doc h2{font-size:1.45rem;font-weight:800;text-align:center}
.agr-sub{text-align:center;font-size:.85rem;color:var(--ink-2);margin:2px 0 14px}
.agr-parties{margin:0 0 12px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.agr-parties div{display:flex;justify-content:space-between;gap:10px;padding:8px 0}
.agr-parties div+div{border-top:1px dashed var(--soft)}
.agr-parties dt{font-size:.85rem;color:var(--ink-2)}
.agr-parties dd{margin:0;font-weight:700;text-align:right}
.agr-terms{padding-left:22px;margin:0;line-height:1.5;font-size:.95rem}
.agr-terms li{margin-bottom:8px}
.agr-ll{display:flex;gap:6px;align-items:flex-start;font-size:.88rem;font-weight:700;padding:8px 10px;border-radius:8px;border:2px solid var(--ink);margin-top:8px;line-height:1.35}
.agr-ll svg{flex:none;margin-top:1px}
.agr-ll.ok{background:var(--green-50)}
.agr-ll.ok svg{color:var(--green)}
.agr-ll.no{background:#fff;border-style:dashed}
.sigs{display:grid;gap:10px}
.sig{border:2px dashed var(--ink);border-radius:10px;padding:10px 12px}
.sig.signed{border-style:solid;background:var(--green-50)}
.sig .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--green-text)}
.sig-line{min-height:40px;display:flex;align-items:flex-end;border-bottom:2px solid var(--ink);margin:4px 0 6px;padding-bottom:2px}
.sig-line .script{font-style:italic;font-size:1.5rem;line-height:1.1}
.sig-line .unsigned{color:var(--ink-2);font-size:.9rem}
.sig-meta{font-size:.85rem;color:var(--ink-2)}
.agr-actions{margin-top:18px;margin-right:4px}
.agr-actions .btn+.btn{margin-top:12px}

/* ---------- date coverage ---------- */
.cov{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;padding:8px 10px;border:2px solid var(--ink);border-radius:8px;font-size:.9rem;font-weight:700;line-height:1.35}
.cov svg{flex:none;margin-top:1px}
.cov small{display:block;font-weight:400;font-size:.82rem;color:var(--ink-2);margin-top:2px}
.cov.full{background:var(--green-50)}
.cov.full svg{color:var(--green)}
.cov.part{background:var(--orange-50);border-style:dashed}
.card .cov{margin:0 0 12px}
.detail-body .cov{margin:-6px 0 18px}

/* ---------- commute ---------- */
.commute{margin:8px 0 0}
.commute .c-items{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;font-weight:700}
.commute .c-items span{display:inline-flex;align-items:center;gap:5px}
.commute .c-items svg{color:var(--green)}
.commute-tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.commute-tiles li{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:2px solid var(--ink);border-radius:12px;background:#fff;text-align:center}
.commute-tiles svg{color:var(--green)}
.commute-tiles strong{font-family:var(--head);font-size:1.15rem;line-height:1.15}
.commute-tiles span{font-size:.82rem;color:var(--ink-2);font-weight:700}

/* ---------- list / map ---------- */
.view-toggle{display:grid;grid-template-columns:1fr 1fr;margin:10px 4px 4px 0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.view-toggle button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:0;background:#fff;font-weight:700;font-size:1rem}
.view-toggle button+button{border-left:2px solid var(--ink)}
.view-toggle button[aria-pressed="true"]{background:var(--green);color:#fff}
.map{position:relative;aspect-ratio:340/400;border:2px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-right:4px;background:#EEF2EC}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin::before{content:"";position:absolute;inset:-6px -4px}   /* invisible padding: 48px-tall tap area */
.pin{position:absolute;transform:translate(-50%,-100%);min-height:36px;padding:0 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font-weight:700;font-size:.85rem;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);z-index:2}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.pin.on{background:var(--green);color:#fff;z-index:3;transform:translate(-50%,-100%) scale(1.08)}
.pin:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.campus{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;z-index:1;pointer-events:none}
.c-dot{width:30px;height:30px;border-radius:50%;background:var(--orange);border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
.c-lbl{font-size:.75rem;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:1px 6px;white-space:nowrap}
.map-key{display:flex;align-items:center;gap:8px;margin:10px 0}
.key-dot{width:14px;height:14px;border-radius:50%;background:var(--orange);border:2px solid var(--ink);flex:none}
.map-preview{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:14px;margin-right:4px;min-height:60px}
.mp-top{display:flex;gap:12px;align-items:flex-start}
.mp-top .thumb{width:56px;height:56px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.mp-top .grow{flex:1;min-width:0}
.mp-top h3{font-size:1.1rem;line-height:1.2;margin-bottom:2px}
.mp-top .price{font-size:.9rem;margin-top:4px}
.mp-top .price strong{font-size:1.1rem}
.map-preview .match{margin-top:10px}
.map-preview .btn{min-height:52px;box-shadow:var(--shadow-sm)}
.mp-save{position:static;width:auto;height:auto;border-radius:12px;display:flex}

/* ---------- Term Swap ---------- */
.sw-ic{width:52px;height:52px;flex:none;border-radius:12px;background:var(--orange);border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink);transform:rotate(-4deg)}
.swap-hero{display:flex;gap:14px;align-items:flex-start;background:var(--green-50);border:2px solid var(--ink);border-radius:12px;padding:14px;margin:4px 4px 18px 0;line-height:1.45}
.swap-hero strong{display:block;font-family:var(--head);font-size:1.1rem}
.swap-entry{width:100%;display:flex;gap:14px;align-items:center;text-align:left;margin-top:16px;padding:14px;border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);min-height:84px}
.swap-entry .grow{flex:1}
.swap-entry strong{display:block;font-family:var(--head);font-size:1.1rem}
.swap-entry .grow span{display:block;font-size:.88rem;color:var(--ink-2);line-height:1.35;margin-top:2px}
.swap-list{list-style:none;margin:0;padding:0 4px 0 0;display:grid;gap:20px}
.swap-card{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.sw-top{display:flex;gap:12px;align-items:flex-start}
.sw-top .grow{flex:1;min-width:0}
.sw-top strong{font-family:var(--head);font-size:1.15rem}
.sw-top p{font-size:.88rem;color:var(--ink-2);line-height:1.35;margin:2px 0 6px}
.verified.sm{font-size:.75rem;padding:2px 8px}
.sw-trade{margin:14px 0 0;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.sw-trade div{padding:10px 12px;background:var(--bg)}
.sw-trade div+div{border-top:2px dashed var(--ink)}
.sw-trade dt{display:flex;gap:6px;align-items:center;font-size:.78rem;font-weight:700;color:var(--green-text);text-transform:uppercase;letter-spacing:.05em}
.sw-trade dd{margin:3px 0 0;font-weight:700}
.sw-trade dd.sub{font-weight:400;font-size:.85rem;color:var(--ink-2)}
.overlap{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:.88rem;font-weight:700;padding:8px 10px;border-radius:8px;border:2px solid var(--ink);line-height:1.35}
.overlap svg{flex:none;margin-top:1px}
.overlap.full{background:var(--green-50)}
.overlap.full svg{color:var(--green)}
.overlap.most{background:var(--orange-50)}
.overlap.part{background:#fff;border-style:dashed}
.swap-card .btn{min-height:52px;box-shadow:var(--shadow-sm)}
.swap-card .req-status{margin-bottom:12px;font-size:.9rem}
.sheet-photo{height:150px;border:2px solid var(--ink);border-radius:12px}

/* ---------- trust level ---------- */
.trust{margin:18px 20px 0 16px;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.trust-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.trust-top h2{font-size:1.5rem;font-weight:800}
.level-mark{width:56px;height:56px;flex:none;border-radius:14px;background:var(--green);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.7rem;transform:rotate(-5deg);box-shadow:var(--shadow-sm)}
.badges{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{width:100%;height:100%;min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:10px 4px;border:2px solid var(--ink);border-radius:12px;background:var(--bg);text-align:center}
.badge .b-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--ink)}
.badge.earned .b-ic{background:var(--green);color:#fff;transform:rotate(-4deg)}
.badge.locked{border-style:dashed;background:#fff}
.badge.locked .b-ic{background:#fff;color:var(--ink-2);border-style:dashed}
.b-name{font-weight:700;font-size:.8rem;line-height:1.2;flex:1}
.b-state{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:5px;border:2px dashed var(--ink);color:var(--ink-2);background:#fff}
.earned .b-state,.b-state.on{border-style:solid;background:var(--green-50);color:var(--green-text)}
.next{margin-top:16px;border-top:2px dashed var(--ink);padding-top:14px}
.next-h{font-size:1rem}
.next-how{color:var(--ink-2);font-size:.9rem;line-height:1.4;margin:4px 0 10px}
.pbar{height:24px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--green) repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 8px,transparent 8px 16px);border-right:2px solid var(--ink)}
.pbar span[style^="width:0%"]{border-right:0}
.pbar-lbl{font-weight:700;font-size:.88rem;margin:6px 0 12px}
.next .btn{min-height:52px;box-shadow:var(--shadow-sm)}

/* ---------- referral ---------- */
.refer{position:relative;margin:20px 20px 0 16px;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:18px 16px 16px;overflow:hidden}
.refer-coin{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--orange);border:2px solid var(--ink)}
.refer-coin::after{content:"$";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.3rem;color:var(--ink)}
.refer h2{font-size:1.35rem;font-weight:800;padding-right:56px;line-height:1.15}
.refer>p{line-height:1.45;margin:8px 0 14px;font-size:.95rem}
.code-box{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.code-lbl{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.code{font-family:var(--head);font-size:1.4rem;letter-spacing:.08em}
.refer .btn{background-image:none}
.refer .btn-accent{background:#fff}
.refer>p.refer-stat{font-size:.85rem;font-weight:700;margin:14px 0 0}
.invite-msg{margin:0 0 16px;background:#fff;border:2px solid var(--ink);border-left:8px solid var(--orange);border-radius:10px;padding:12px;line-height:1.45}
#sheetBody .btn-ghost[data-action="sendInvite"]{justify-content:flex-start}

/* ---------- review & boost ---------- */
.boost-tag{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;margin-bottom:8px;transform:rotate(-2deg)}
.boost-tag.inline{margin:0 0 0 4px;vertical-align:middle}
.card.preview{margin-right:4px}
.summary.plain div:last-child{border-top:0;background:#fff}
.summary.plain div:last-child dt{font-weight:400;color:var(--ink-2)}
.boost-opt{width:100%;display:flex;align-items:center;gap:14px;min-height:84px;border:2px solid var(--ink);border-radius:12px;background:#fff;text-align:left;padding:12px;box-shadow:var(--shadow-sm)}
.boost-opt[aria-checked="true"]{background:var(--green-50);box-shadow:var(--shadow)}
.boost-opt .mi-ic{width:48px;height:48px;border-radius:10px;background:var(--orange);display:grid;place-items:center;flex:none;border:2px solid var(--ink)}
.boost-opt .mi-text{flex:1}
.boost-opt strong{display:block;font-family:var(--head);font-size:1.05rem}
.boost-opt small{display:block;color:var(--ink-2);font-size:.85rem;line-height:1.35;margin-top:2px}
.summary.fees dt small{display:block;font-size:.8rem;color:var(--ink-2)}
.fee-note{line-height:1.45;font-size:.88rem;font-weight:700;color:var(--ink);background:var(--orange-50);border:2px dashed var(--ink);border-radius:8px;padding:8px 10px;margin-top:14px}
.success .fee-note{margin:-8px 0 24px}

/* ---------- payment ---------- */
.pay-listing{display:flex;gap:12px;align-items:center;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px;margin:4px 0 16px;width:100%;text-align:left}
.pay-listing .thumb{width:52px;height:52px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.pay-listing .grow{flex:1;min-width:0}
.pay-listing strong{display:block;font-family:var(--head)}
.pay-listing span span,.pay-listing div span{display:block;font-size:.85rem;color:var(--ink-2)}
.pay-listing.as-btn{min-height:72px;margin:6px 0 16px;box-shadow:var(--shadow-sm)}
.flow{list-style:none;margin:0 0 18px;padding:0}
.flow li{position:relative;display:grid;grid-template-columns:52px 1fr;column-gap:12px;padding-bottom:16px}
.flow li:not(:last-child)::before{content:"";position:absolute;left:24px;top:54px;bottom:2px;border-left:3px dashed var(--ink)}
.flow-ic{grid-row:span 2;width:52px;height:52px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;background:#fff}
.flow li:nth-child(2) .flow-ic{background:var(--green);color:#fff;transform:rotate(-4deg)}
.flow li:last-child .flow-ic{background:var(--orange)}
.flow strong{font-family:var(--head);font-size:1.05rem;align-self:end}
.flow li>span:last-child{color:var(--ink-2);font-size:.9rem;line-height:1.4}
.opt.agree{align-items:flex-start;padding:14px;line-height:1.4;margin-top:8px}
.opt.agree input{margin-top:1px;flex:none}

/* ---------- booking status ---------- */
.status-hero{background:var(--green-50);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin:4px 4px 16px 0}
.status-hero h2{font-size:1.7rem;font-weight:800;margin:10px 0 4px}
.status-hero p{font-weight:700}
.status-hero .status{background:#fff}
.held{display:flex;gap:12px;align-items:center;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;margin-right:4px;box-shadow:var(--shadow)}
.held svg{flex:none}
.held strong{display:block;font-family:var(--head);font-size:1.25rem}
.held span{font-size:.9rem;line-height:1.35}
.tracker{list-style:none;margin:4px 0 8px;padding:0}
.tracker li{position:relative;display:grid;grid-template-columns:46px 1fr;gap:12px;padding-bottom:22px}
.tracker li:not(:last-child)::before{content:"";position:absolute;left:21px;top:48px;bottom:2px;width:4px;background:var(--soft);border-radius:2px}
.tracker li.done:not(:last-child)::before{background:var(--green)}
.mark{width:46px;height:46px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-family:var(--head);font-size:1.1rem;background:#fff}
.done .mark{background:var(--green);color:#fff}
.current .mark{background:var(--orange);box-shadow:var(--shadow-sm);transform:rotate(-4deg)}
.todo .mark{color:var(--ink-2);border-style:dashed}
.tracker strong{font-family:var(--head);font-size:1.1rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px}
.tag{font-family:'Atkinson Hyperlegible',sans-serif;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:5px;border:2px solid var(--ink);background:#fff}
.done .tag{background:var(--green-50);color:var(--green-text)}
.current .tag{background:var(--orange)}
.todo .tag{border-style:dashed;color:var(--ink-2)}
.tracker p{color:var(--ink-2);font-size:.92rem;line-height:1.4;margin-top:4px}
.tracker .btn{margin-top:12px;min-height:54px}
.tracker .help{margin-top:8px}

/* ---------- role picker ---------- */
.role-list{list-style:none;margin:0;padding:0 4px 0 0;display:grid;gap:18px}
.role-opt{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:18px 14px;min-height:120px;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.role-opt:hover{background:var(--green-50)}
.role-opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.role-ic{width:64px;height:64px;flex:none;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--orange);transform:rotate(-4deg)}
.role-list li:first-child .role-ic{background:var(--green);color:#fff}
.role-text{flex:1}
.role-text strong{display:block;font-family:var(--head);font-size:1.2rem;line-height:1.2;margin-bottom:4px}
.role-text span{display:block;color:var(--ink-2);font-size:.9rem;line-height:1.4}

/* ---------- host dashboard ---------- */
.host-card{margin-top:22px;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-right:4px}
.hc-top{display:flex;gap:12px;align-items:flex-start}
.hc-top .thumb{width:60px;height:60px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.hc-top .grow{flex:1;min-width:0}
.hc-top h2{font-size:1.2rem;line-height:1.2;margin:6px 0 4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:6px;border:2px solid var(--ink);background:var(--green-50);color:var(--green-text)}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.status.booked{background:var(--orange);color:var(--ink)}
.status.booked::before{background:var(--ink)}
.stats{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.stats li{padding:10px 12px;display:flex;flex-direction:column}
.stats li:nth-child(odd){border-right:2px dashed var(--ink)}
.stats li:nth-child(-n+2){border-bottom:2px dashed var(--ink)}
.stats .num{font-family:var(--head);font-weight:800;font-size:1.7rem;line-height:1.1}
.stats .lbl{font-size:.82rem;font-weight:700;color:var(--green-text);text-transform:uppercase;letter-spacing:.06em}
.hc-h{font-size:1.05rem;margin:18px 0 8px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:110px;align-items:end;padding:0 2px}
.bar{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar>span{width:100%;background:var(--green);border:2px solid var(--ink);border-radius:4px 4px 0 0;min-height:6px}
.bar b{font-size:.75rem;color:var(--ink-2)}
.req{border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--bg)}
.req+.req{margin-top:10px}
.req-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.req-top .grow{flex:1;min-width:0}
.req-top p{font-size:.88rem;color:var(--ink-2);line-height:1.35}
.req .btn{min-height:52px;box-shadow:var(--shadow-sm)}
.req .req-msg{margin-top:10px}
/* students looking */
.looking{margin-top:26px}
.sl-list{list-style:none;margin:0;padding:0 4px 0 0;display:grid;gap:16px}
.sl-card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.sl-card .req-top{margin-bottom:10px}
.sl-card .req-top strong{font-family:var(--head);font-size:1.1rem}
.sl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sl-tags .verified,.sl-tags .match.static{white-space:nowrap;margin:0}
.sl-facts{margin:0 0 10px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.sl-facts div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--bg)}
.sl-facts div+div{border-top:2px dashed var(--soft)}
.sl-facts dt{font-size:.85rem;font-weight:700;color:var(--green-text)}
.sl-facts dd{margin:0;font-weight:700;text-align:right;font-size:.92rem}
.sl-card .cov{margin:0 0 10px}
.sl-habits{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sl-habits li{font-size:.82rem;font-weight:700;padding:3px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--green-50)}
.sl-card .btn{min-height:52px;box-shadow:var(--shadow-sm)}
.row2 .btn+.btn{margin-top:0}
.req-status{display:flex;align-items:center;gap:8px;font-weight:700;padding:10px 12px;border-radius:8px;border:2px solid var(--ink)}
.req-status.accepted{background:var(--orange)}
.req-status.declined{background:#fff;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<aside class="notes" aria-label="About this prototype">
  <div id="notesLogo"></div>
  <h2>Clickable prototype</h2>
  <p>A student sublease app for University of Miami students. Front end only, with sample data.</p>
  <ol>
    <li>Sign up with any <strong>.edu</strong> email</li>
    <li>Enter any 6-digit code</li>
    <li>Choose: looking for a place, or subleasing yours</li>
    <li>Switch any time from Profile</li>
  </ol>
  <button class="restart" type="button" onclick="location.reload()">Restart prototype</button>
</aside>

<div class="stage" id="stage">
  <div class="phone" role="region" aria-label="TermNest app on iPhone">

      <div class="island" aria-hidden="true"></div>
      <div class="statusbar" id="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4.5a10 10 0 0 1 14 0M3.8 7.4a6 6 0 0 1 8.4 0"/><circle cx="8" cy="10.3" r="1.2" fill="currentColor" stroke="none"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>
      <main id="app" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="Main navigation" hidden>
        <button class="tab" data-action="tab" data-tab="home"><span class="tab-ic" id="homeIc"></span><span id="homeLbl">Search</span></button>
        <button class="tab" data-action="tab" data-tab="saved"><span class="tab-ic" data-ic="heart"></span>Saved</button>
        <button class="tab post" data-action="tab" data-tab="post"><span class="tab-ic" data-ic="plus"></span>Post</button>
        <button class="tab" data-action="tab" data-tab="messages" id="msgTab"><span class="tab-ic" data-ic="chat"></span>Messages</button>
        <button class="tab" data-action="tab" data-tab="profile"><span class="tab-ic" data-ic="user"></span>Profile</button>
      </nav>
      <div id="sheetRoot" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="home-ind" aria-hidden="true"></div>
    </div>
  </div>
</div>

function compare(q, you, them){
  if (q.type==='scale'){ const d=Math.abs(you-them); return [['match',1],['close',.5],['diff',0]][d]; }
  if (q.type==='equal') return you===them ? ['match',1] : ['diff',0];
  return (you===0 || you===them) ? ['match',1] : ['diff',0];   // tolerance
}
// A match is only shown when at least this many of your answers can be compared with the listing
const MIN_SHARED = 3;
const answeredCount = () => state.habits ? Object.keys(state.habits).length : 0;
const canMatch = () => answeredCount() >= MIN_SHARED;
const sharedCount = l => (l.habits && state.habits) ? PREFS.filter(q=>state.habits[q.key]!==undefined && l.habits[q.key]!==undefined).length : 0;
function matchFor(l){
  if (l.mine || !canMatch() || !l.habits) return null;
  const rows=[], skipped=[];
  PREFS.forEach(q=>{
    const you=state.habits[q.key], them=l.habits[q.key];
    if (you===undefined) return;
    if (them===undefined){ skipped.push(q.label); return; }
    const [status,score]=compare(q,you,them);
    rows.push({...q, you:q.opts[you], them:(q.house||q.opts)[them], status, score});
  });
  if (rows.length < MIN_SHARED) return null;
  return {pct:Math.round(rows.reduce((s,r)=>s+r.score,0)/rows.length*100), rows, skipped,
          unanswered:PREFS.filter(q=>state.habits[q.key]===undefined).map(q=>q.label)};
}
const tier = p => p>=75 ? ['high','Great match'] : p>=50 ? ['mid','Good match'] : ['low','Low match'];
function matchBtn(l, big){
  const m = matchFor(l);
  if (!m){
    if (!big || l.mine) return '';
    // On listing details, explain why there's no match and how to get one
    if (!canMatch()){
      const n=answeredCount();
      const msg = n ? `Answer at least ${MIN_SHARED} preferences to see your roommate match (you’ve answered ${n})`
                    : 'Add your preferences to see your roommate match';
      return `<button class="pref-nudge" data-action="editHabits">${ic('people',22)}<span>${msg}</span>${ic('next')}</button>`;
    }
    const s=sharedCount(l);
    return `<div class="pref-nudge info">${ic('people',22)}<span>No roommate match for this listing. Only ${s} of your answers apply here${l.roommates?'':' since it’s an entire place'}, and we need at least ${MIN_SHARED} to compare.</span></div>`;
  }
  const [cls, word] = tier(m.pct);
  const label = `${m.pct}% roommate match, ${word.toLowerCase()}. Show what matches`;
  return big
    ? `<button class="match-card ${cls}" data-action="match" data-id="${l.id}" aria-label="${label}">
        <span class="pct">${m.pct}%</span>
        <span class="grow"><strong>Roommate match</strong><span>${word} · See what matches</span></span>${ic('next')}</button>`
    : `<button class="match ${cls}" data-action="match" data-id="${l.id}" aria-label="${label}">${ic('people',18)}<strong>${m.pct}%</strong> match</button>`;
}

/* ---------- date coverage ----------
   How much of the user's searched dates (filters.from → filters.to) a listing covers. */
const dayDiff = (a,b) => Math.round((toDate(b)-toDate(a))/864e5);
function coverage(l, f=state.filters){
  if (!(f.from && f.to)) return null;
  const a = l.moveIn>f.from ? l.moveIn : f.from, b = l.moveOut<f.to ? l.moveOut : f.to;
  const total = Math.max(1, dayDiff(f.from,f.to)), days = Math.max(0, dayDiff(a,b));
  const late = Math.max(0, dayDiff(f.from,l.moveIn)), early = Math.max(0, dayDiff(l.moveOut,f.to));
  const full = !late && !early;
  const pct = full ? 100 : Math.min(99, Math.round(days/total*100));   // never say 100% for a partial match
  return {full, pct, days, late, early};
}
const gapText = d => d<7 ? `${d} day${d===1?'':'s'}` : `${Math.round(d/7)} week${Math.round(d/7)===1?'':'s'}`;
function coverageText(c){
  if (c.full) return 'Covers 100% of your dates';
  const parts=[];
  if (c.late) parts.push(`starts ${gapText(c.late)} late`);
  if (c.early) parts.push(`ends ${gapText(c.early)} early`);
  return `Covers ${c.pct}%, ${parts.join(' and ')}`;
}
function coverageHTML(l, withDates){
  const c=coverage(l); if (!c) return '';
  const f=state.filters;
  return `<p class="cov ${c.full?'full':'part'}">${ic(c.full?'check':'calendar',18)}<span>${coverageText(c)}${withDates?`<small>Your dates: ${fmtShort(f.from)} – ${fmt(f.to)}</small>`:''}</span></p>`;
}
function matches(l,f){
  if (l.mine) return false; // your own listings don't show up in your search
  if (f.q){ const q=f.q.toLowerCase(); if(!(l.title+' '+l.area+' '+l.type).toLowerCase().includes(q)) return false; }
  if (l.price > f.maxPrice) return false;
  if (f.distance && l.dist > f.distance) return false;
  if (f.from && f.to){
    if (coverage(l,f).days <= 0) return false;          // keep partial matches, drop rooms with no overlap
  } else {
    if (f.from && l.moveIn > f.from) return false;      // only one date set: must be available on it
    if (f.to && l.moveOut < f.to) return false;
  }
  return true;
}

  landlord({id}={}){

      return `<li class="${st}" ${i===idx?'aria-current="step"':''}><span class="mark" aria-hidden="true">${st==='done'?ic('check',18):i+1}</span>

      : `
        <div class="ll-card approved">${ic('check',28)}<div><strong>Approved by ${esc(ll.name)}</strong>

        ${!id && ll.status!=='approved' ? `<p class="help" style="margin-top:14px">You can continue and publish now. Subletters can’t sign the agreement until your landlord approves.</p>`:''}

  agreement({id, as}){
    const l=L(id), a=state.agreements[id], ll=l.landlord||{status:'approved'};
    const otherKey = as==='sublessor'?'subtenant':'sublessor', me=a[as], other=a[otherKey];
    const otherFirst=esc(other.name.split(' ')[0]), both=a.sublessor.signed&&a.subtenant.signed, llOk=ll.status==='approved';
    const banner = both ? ['done','check','Signed by both','Both signatures are on file with TermNest.']
      : me.signed ? ['wait','calendar',`Waiting for ${otherFirst} to sign`,'We’ve sent them a reminder.']
      : !llOk ? ['block','lock','Waiting for landlord approval','Signing opens once the landlord approves.']
      : ['ready','book','Ready for your signature','Read it through, then sign at the bottom.'];
    const sig=(key,role)=>{ const p=a[key], mine=key===as;
      return `<div class="sig ${p.signed?'signed':''}"><p class="lbl">${role}</p>
        <p class="sig-line">${p.signed?`<span class="script">${esc(p.typed||p.name)}</span>`:'<span class="unsigned">Not signed yet</span>'}</p>
        <p class="sig-meta">${esc(p.name)}${mine?' (you)':''} · ${p.signed?`Signed ${fmt(p.signed)}`:'Waiting'}</p></div>`; };
    const terms=[
      ['The room', `${esc(l.type)} at “${esc(l.title)},” ${esc(l.area)}, Miami.`],
      ['Dates', `Move-in ${fmtLong(l.moveIn)}. Move-out ${fmtLong(l.moveOut)} (${weeks(l.moveIn,l.moveOut)} weeks).`],
      ['Rent', `${money(l.price)} per month, paid through TermNest. The first month is held by TermNest and released to the sublessor after the subtenant confirms move-in.`],
      ['Deposit', 'None.'],
      ['Utilities', l.utilities?'Included in rent.':'Split with the household.'],
      ['Original lease', 'The subtenant follows the rules of the original lease. The sublessor stays responsible to the landlord.'],
      ['Cancelling', 'Either person can cancel before move-in for a full refund.'],
      ['Condition', 'The subtenant reports any problems within 24 hours of move-in.']];
    let action='';
    if(both) action = `<button class="btn btn-ghost" data-action="emailCopy">${ic('mail')} Email me a copy</button>`;
    else if(me.signed) action = `<button class="btn btn-ghost" data-action="remindSign">${ic('bell')} Send ${otherFirst} a reminder</button>
        <button class="btn btn-accent" data-action="otherSigns">Demo: ${otherFirst} signs now</button>

    else if(!llOk) action = as==='sublessor'
        ? `<button class="btn btn-primary" data-action="go" data-to="landlord" data-id="${l.id}">Check landlord approval</button>`
        : `<button class="btn btn-ghost" data-action="messageHost" data-id="${l.id}">${ic('chat')} Message ${otherFirst}</button>`;
    else action = `<form id="signForm" class="form" novalidate>
        <label class="opt agree"><input type="checkbox" name="agree" aria-describedby="err-agreeSign">I’ve read this sublease agreement and agree to its terms.</label>
        <p class="error" id="err-agreeSign"></p>
        <div class="field" style="margin-top:12px"><label for="sigName">Type your full name to sign</label>
          <input id="sigName" name="sig" autocomplete="name" placeholder="${esc(state.user.name)}" aria-describedby="err-sigName"><p class="error" id="err-sigName"></p></div>
        <button class="btn btn-primary" type="submit">Sign agreement</button></form>`;
    return `${topbar('Sublease agreement',true,'Back')}
      <div class="pad">
        <div class="agr-banner ${banner[0]}" id="agrBanner" tabindex="-1">${ic(banner[1],26)}<div><strong>${banner[2]}</strong><span>${banner[3]}</span></div></div>

          <h2 id="agrTitle">Sublease Agreement</h2>
          <p class="agr-sub">Made through TermNest on ${fmt(todayISO())}</p>
          <dl class="agr-parties">
            <div><dt>Sublessor (current tenant)</dt><dd>${esc(a.sublessor.name)}</dd></div>
            <div><dt>Subtenant</dt><dd>${esc(a.subtenant.name)}</dd></div>
          </dl>
          <ol class="agr-terms">${terms.map(([h,t])=>`<li><strong>${h}.</strong> ${t}</li>`).join('')}</ol>
          <p class="agr-ll ${llOk?'ok':'no'}">${ic(llOk?'check':'lock',18)} Landlord approval: ${llOk?`approved by ${esc(ll.name)} on ${fmt(ll.on)}`:llLabel(ll.status).toLowerCase()}</p>
          <h3 class="section-h">Signatures</h3>
          <div class="sigs">${sig('sublessor','Sublessor')}${sig('subtenant','Subtenant')}</div>
        </article>
        <div class="agr-actions">${action}</div>
        <div class="endspace"></div>
      </div>`;
  },

/* ---------- students looking (on the subleaser's home) ----------
   Shows students whose dates overlap your listing, most overlap first. If nobody overlaps,
   it shows the students looking soonest so the list is never empty. */
const overlapDays = (a1,b1,a2,b2) => Math.max(0, dayDiff(a1>a2?a1:a2, b1<b2?b1:b2));
function studentMatch(s, l){
  if (!l || !l.habits) return null;
  const rows = PREFS.filter(q => s.habits[q.key]!==undefined && l.habits[q.key]!==undefined)
    .map(q => compare(q, s.habits[q.key], l.habits[q.key])[1]);
  return rows.length >= MIN_SHARED ? Math.round(rows.reduce((a,b)=>a+b,0)/rows.length*100) : null;
}
function studentCard(s, l){
  const days = l ? overlapDays(s.from,s.to,l.moveIn,l.moveOut) : 0, need = Math.max(1, dayDiff(s.from,s.to));
  const cov = Math.min(100, Math.round(days/need*100)), pct = studentMatch(s,l), fits = l && s.budget >= l.price;
  const habits = ['sleep','clean','noise','study'].map(k => PREFS.find(q=>q.key===k)).map(q => q.opts[s.habits[q.key]]);
  return `<li class="sl-card">
    <div class="req-top"><span class="avatar y" aria-hidden="true">${esc(s.name[0])}</span>
      <div class="grow"><strong>${esc(s.name)}</strong><p>${esc(s.year)} · ${esc(s.major)}</p>
        <span class="sl-tags"><span class="verified sm">${ic('verified',14)} Verified student</span>
        ${pct===null ? '' : `<span class="match static ${tier(pct)[0]}">${ic('people',14)}<strong>${pct}%</strong><span class="sr-only"> roommate</span> match</span>`}</span></div></div>
    <dl class="sl-facts">
      <div><dt>Needs</dt><dd>${fmtShort(s.from)} – ${fmt(s.to)}</dd></div>
      <div><dt>Budget</dt><dd>Up to ${money(s.budget)}/mo</dd></div>
      <div><dt>Prefers</dt><dd>${esc(s.area)}</dd></div>
    </dl>
    ${l ? `<p class="cov ${cov===100?'full':'part'}">${ic(cov===100?'check':'calendar',18)}<span>${days ? `Your room covers ${cov}% of their dates` : 'Their dates don’t overlap yours'}${fits?'':` · over their budget by ${money(l.price - s.budget)}`}</span></p>` : ''}
    <ul class="sl-habits" aria-label="${esc(s.name)}’s habits">${habits.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
    <button class="btn btn-ghost" data-action="inviteStudent" data-name="${esc(s.name)}">${ic('send')} Send ${esc(s.name)} your listing</button>
  </li>`;
}
function studentsLooking(mine){
  const l = mine.find(x => x.moveIn && x.moveOut);
  let list = l ? STUDENTS.filter(s => overlapDays(s.from,s.to,l.moveIn,l.moveOut) > 0)
      .sort((a,b) => overlapDays(b.from,b.to,l.moveIn,l.moveOut) - overlapDays(a.from,a.to,l.moveIn,l.moveOut)) : [];
  const fallback = !list.length;
  if (fallback) list = [...STUDENTS].sort((a,b) => a.from < b.from ? -1 : 1).slice(0,3);
  return `<section class="looking" aria-labelledby="lookH">
    <h2 class="section-h" id="lookH">Students looking for your dates</h2>
    <p class="help" style="margin:-4px 0 12px">${l ? `${list.length} verified student${list.length===1?'':'s'} ${fallback?'looking soon':'need a place during'} ${fallback?'':`${fmtShort(l.moveIn)} – ${fmt(l.moveOut)}`}` : 'Post your room to see who needs your dates.'}</p>
    ${fallback && l ? `<p class="pref-nudge info" style="margin:0 0 12px">${ic('calendar',22)}<span>No one needs your exact dates yet. Here are students looking soon.</span></p>` : ''}
    <ul class="sl-list">${list.map(s => studentCard(s, l)).join('')}</ul>
  </section>`;
}

// Called after anyone signs: when both have signed, move the booking forward and charge the listing fee
function finishSigning(id){
  const a=state.agreements[id], l=L(id), both=a.sublessor.signed&&a.subtenant.signed;
  if(both){
    if(state.bookings[id] && state.bookings[id].step<2) state.bookings[id].step=2;
    if(l.mine) l.feeCharged=true;
  }
  render(); document.getElementById('agrBanner')?.focus({preventScroll:true});
  toast(!both ? 'You signed. Waiting for the other person.'

function overlapWith(m){
  const s=state.swap, a=s.from>m.from?s.from:m.from, b=s.to<m.to?s.to:m.to;
  const days=Math.max(0,(toDate(b)-toDate(a))/864e5), total=Math.max(1,(toDate(s.to)-toDate(s.from))/864e5);
  const frac=days/total;
  const fit = (a===s.from && b===s.to) ? ['full','check','Covers your whole trip']
            : frac>=.6 ? ['most','calendar','Covers most of your trip'] : ['part','calendar','Covers part of your trip'];
  return {os:a, oe:b, days, weeks:Math.round(days/7), fit};
}

function renderResults(){
  if(state.sort==='match' && !canMatch()) state.sort='featured';
  const pct=l=>matchFor(l)?.pct ?? -1;
  const sorters={
    featured:(a,b)=>(b.boosted?1:0)-(a.boosted?1:0) || (coverage(b)?.pct??0)-(coverage(a)?.pct??0),  // Boosted first, then most date coverage
    match:(a,b)=>pct(b)-pct(a) || a.price-b.price,            // best match, then cheaper
    price:(a,b)=>a.price-b.price,
    dist:(a,b)=>a.dist-b.dist
  };
  // Rooms that cover all of the searched dates always come first; the chosen sort applies within each group
  const partial=l=>{ const c=coverage(l); return c && !c.full ? 1 : 0; };
  const list=state.listings.filter(l=>matches(l,state.filters)).sort((a,b)=>partial(a)-partial(b) || sorters[state.sort](a,b));
  const fullCount=(state.filters.from && state.filters.to) ? list.filter(l=>coverage(l).full).length : null;
  if(state.mapSel && !list.some(l=>l.id===state.mapSel)) state.mapSel=null;   // selected pin got filtered out
  const empty=`<div class="empty" style="padding:20px 8px"><h2>No rooms match</h2><p>Try different dates, a higher price, or a longer distance.</p><button class="btn btn-ghost" data-action="resetFilters">Clear all filters</button></div>`;
  document.getElementById('results').innerHTML = !list.length ? empty
    : state.view==='map' ? mapHTML(list) : `<ul class="cards">${list.map(cardHTML).join('')}</ul>`;
  const sortName={featured:'featured first',match:'best match first',price:'lowest price first',dist:'closest to campus first'}[state.sort];
  document.getElementById('resultCount').textContent = state.view==='map'
    ? `${list.length} room${list.length===1?'':'s'} on the map`
    : fullCount!==null
      ? `${list.length} room${list.length===1?'':'s'} · ${fullCount} cover${fullCount===1?'s':''} all your dates · full matches first, then ${sortName}`
      : `${list.length} room${list.length===1?'':'s'} available · ${sortName}`;
}

function go(name, params={}, opts={}){
  if (opts.reset) state.history=[];

  state.current=name; state.params=params; render();

function threadFor(l){
  let t=state.threads.find(t=>t.listingId===l.id);
  if(!t){ t={id:'t'+l.id+'x',name:l.host.name,initials:l.host.initials,listingId:l.id,unread:false,msgs:[]}; state.threads.unshift(t); }
  return t;
}
const REPLIES=['Thanks! I’ll get back to you shortly.','Good question, let me check with my roommates.','Sure! Does Thursday at 6 PM work for a video tour?','Sounds good. You can request to book whenever you’re ready.'];
function sendMessage(text){
  text=text.trim(); if(!text) return;
  const t=T(state.params.id), log=document.getElementById('log');
  const m={me:true,text,time:'Now'}; t.msgs.push(m);
  state.fastReplies++;
  if(state.fastReplies===3) setTimeout(()=>toast('Badge unlocked: Fast Replier!'),300);
  log.insertAdjacentHTML('beforeend',msgHTML(m,t)); app.scrollTop=app.scrollHeight;
  const id=t.id;
  setTimeout(()=>{
    const r={me:false,text:t.support?'Thanks for reaching out. A TermNest team member will reply within 1 hour.':REPLIES[t.msgs.length%REPLIES.length],time:'Now'};
    t.msgs.push(r);
    if(state.current==='chat'&&state.params.id===id){ document.getElementById('log').insertAdjacentHTML('beforeend',msgHTML(r,t)); app.scrollTop=app.scrollHeight; }
    else { t.unread=true; updateBadge(); }
  },1400);
}
