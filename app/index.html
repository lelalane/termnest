document.querySelector('.glass').addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const fn=actions[el.dataset.action]; if(fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !sheetRoot.hidden) closeSheet();
  if(e.key==='Tab' && !sheetRoot.hidden){
    const f=[...sheetRoot.querySelectorAll('button,input,select,textarea,[tabindex="-1"]')].filter(x=>!x.disabled);
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
app.addEventListener('input',e=>{
  if(e.target.id==='q'){ state.filters.q=e.target.value; renderResults(); }
  if(e.target.name==='sort'){ state.sort=e.target.value; renderResults(); }
});
function setErr(input,id,msg){ document.getElementById(id).textContent=msg; input.setAttribute('aria-invalid',msg?'true':'false'); return !msg; }
app.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='signupForm'){
    const nameEl=f.querySelector('#fName'), emailEl=f.querySelector('#fEmail'), email=emailEl.value.trim();
    let ok=true, firstBad=null;
    if(nameEl){ if(!setErr(nameEl,'fNameErr',nameEl.value.trim()?'':'Enter your first name.')){ ok=false; firstBad=nameEl; } }
    const em = !email ? 'Enter your school email.' : !/^[^\s@]+@([a-z0-9-]+\.)+edu$/i.test(email) ? 'Use a school email that ends in .edu, like you@miami.edu.' : '';
    if(!setErr(emailEl,'fEmailErr',em)){ ok=false; firstBad=firstBad||emailEl; }
    if(!ok) return firstBad.focus();
    state.user.email=email;
    if(nameEl) state.user.name=nameEl.value.trim();
    else if(!state.user.name){ const n=email.split('@')[0].replace(/[^a-z].*$/i,''); state.user.name=n?n[0].toUpperCase()+n.slice(1).toLowerCase():'Student'; }
    go('verify');
  }
  if(f.id==='verifyForm'){
    const c=f.querySelector('#fCode');
    if(!setErr(c,'fCodeErr',/^\d{6}$/.test(c.value.trim())?'':'Enter the 6-digit code from your email.')) return c.focus();
    go('role',{}, {reset:true}); toast('Email verified');
  }
  if(f.id==='chatForm'){ const i=f.querySelector('#msgInput'); sendMessage(i.value); i.value=''; i.focus(); }
  if(f.id==='postForm') submitPost(f);
  if(f.id==='landlordForm'){
    const n=f.elements.name, e=f.elements.email;
    const ok=[setErr(n,'err-llName',n.value.trim()?'':'Enter your landlord or property manager’s name.'),
              setErr(e,'err-llEmail',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.value.trim())?'':'Enter a valid email, like leasing@example.com.')];
    if(ok.includes(false)) return (ok[0]?e:n).focus();
    const ll=currentLL(); ll.name=n.value.trim(); ll.email=e.value.trim();
    openSheet('Send approval request',`
      <dl class="summary plain">
        <div><dt>To</dt><dd>${esc(ll.name)}<br>${esc(ll.email)}</dd></div>
        <div><dt>Subject</dt><dd>Request to sublet my room</dd></div>
      </dl>
      <div class="field"><label for="llMsg">Message (you can edit it)</label>
        <textarea id="llMsg" rows="12">${esc(llRequestText(ll))}</textarea></div>
      <button class="btn btn-primary" data-action="sendLL">${ic('send')} Send request</button>
      <button class="btn btn-ghost" data-action="closeSheet">Not now</button>`);
  }
  if(f.id==='signForm'){
    const agree=f.elements.agree, sig=f.elements.sig;
    const ok=[setErr(agree,'err-agreeSign',agree.checked?'':'Please confirm you agree to the terms.'),
              setErr(sig,'err-sigName',sig.value.trim().length>=2?'':'Type your full name to sign.')];
    if(ok.includes(false)) return (ok[0]?sig:agree).focus();
    const {id,as}=state.params, me=state.agreements[id][as];
    me.signed=todayISO(); me.typed=sig.value.trim();
    finishSigning(id);
  }
  if(f.id==='swapForm'){
    const city=f.elements.city, from=f.elements.from, to=f.elements.to;
    const ok=[setErr(city,'err-city',city.value?'':'Choose where you’re going.'),
              setErr(from,'err-from',from.value?'':'Choose the date you leave Miami.'),
              setErr(to,'err-to',!to.value?'Choose the date you come back.':(from.value&&to.value<=from.value)?'Coming back must be after leaving.':'')];
    if(ok.includes(false)) return [city,from,to][ok.indexOf(false)].focus();
    state.swap={city:city.value, from:from.value, to:to.value, searched:true};
    render(app.scrollTop);
    const h=document.getElementById('swapH'); h.scrollIntoView({block:'start'}); h.focus({preventScroll:true});
  }
  if(f.id==='prefsForm'){
    const h={};
    PREFS.forEach(q=>{ const v=f.elements[q.key].value; if(v!=='') h[q.key]=+v; });
    state.habits = Object.keys(h).length ? h : null;
    if(canMatch() && state.sort==='featured') state.sort='match';
    if(!canMatch() && state.sort==='match') state.sort='featured';
    const n=Object.keys(h).length;
    const msg = !n ? 'No answers picked, so matches stay off'
      : n<MIN_SHARED ? `Saved ${n} answer${n>1?'s':''}. Answer at least ${MIN_SHARED} to see matches`
      : `Preferences saved (${n} of ${PREFS.length}) · matches on`;
    if(state.params.onboarding){ go('home',{}, {reset:true}); } else back();
    toast(msg);
  }
  if(f.id==='payForm'){
    const agree=f.elements.agree;
    if(!setErr(agree,'err-agree',agree.checked?'':'Please confirm you understand how your rent is held.')) return agree.focus();
    const l=L(f.dataset.id);
    state.bookings[l.id]={step:1, method:f.elements.method.value};
    threadFor(l).msgs.push({me:true,text:`Hi ${l.host.name.split(' ')[0]}! I just reserved your room for ${fmtShort(l.moveIn)} – ${fmt(l.moveOut)}.`,time:'Now'});
    go('booking',{id:l.id},{replace:true});
    toast(`Reserved! ${money(l.price)} is held by TermNest`);
  }
});
function submitPost(f){
  const v=Object.fromEntries(new FormData(f)), errs=[];
  const chk=(name,cond,msg)=>{ const el=f.elements[name]; setErr(el,'err-'+name,cond?'':msg); if(!cond) errs.push([el,msg]); };
  chk('title',v.title.trim().length>=4,'Add a title of at least 4 characters.');
  chk('area',!!v.area,'Choose a neighborhood.');
  chk('price',+v.price>=100,'Enter a monthly rent of at least $100.');
  chk('dist',v.dist!==''&&+v.dist>=0,'Enter the distance to campus in miles.');
  chk('moveIn',!!v.moveIn,'Choose a move-in date.');
  chk('moveOut',!!v.moveOut&&(!v.moveIn||v.moveOut>v.moveIn),v.moveOut?'Move-out must be after move-in.':'Choose a move-out date.');
  const box=document.getElementById('postErrors');
  if(errs.length){
    box.innerHTML=`<div class="err-summary" role="alert"><h2>Please fix ${errs.length} thing${errs.length>1?'s':''}</h2><ul>${errs.map(([el,m])=>`<li><button type="button" data-focus="${el.id}">${m}</button></li>`).join('')}</ul></div>`;
    box.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.focus).focus()));
    box.focus(); return;
  }
  state.draft={...v, title:v.title.trim(), desc:v.desc.trim(), photos:state.photosToAdd, boost:state.draft?.boost||false,
    landlord:state.draft?.landlord||{status:'none',name:'',email:''}};
  go('landlord');
}
const LISTING_FEE=15, BOOST_FEE=5;
function draftToListing(d){
  return {id:Date.now(),mine:true,title:d.title,area:d.area,dist:+(+d.dist).toFixed(1),price:+d.price,moveIn:d.moveIn,moveOut:d.moveOut,type:d.type,
    roommates:d.type==='Entire place'?0:1,furnished:!!d.furnished,utilities:!!d.utilities,tone:state.listings.length%4,boosted:!!d.boost,boostMethod:d.method,
    desc:d.desc||'No description yet.',host:{name:state.user.name,initials:state.user.name.slice(0,1).toUpperCase(),about:'You · '+state.user.email},
    photos:draftPhotos(d), landlord:{...(d.landlord||{status:'none',name:'',email:''})}};
}
function publishDraft(){
  const l=draftToListing(state.draft);
  l.stats={views:0,saves:0,messages:0,week:[0,0,0,0,0,0,0],requests:[]};
  state.listings.unshift(l); state.myListings.unshift(l.id); state.draft=null;
  go('postSuccess',{id:l.id},{reset:true});
}

tabbar.querySelectorAll('[data-ic]').forEach(s=>s.innerHTML=ic(s.dataset.ic,26));
document.getElementById('notesLogo').innerHTML=logo(false);
function fit(){
  const s=Math.min(1,(innerHeight-32)/868,(innerWidth-24)/414);
  document.documentElement.style.setProperty('--s',s.toFixed(3));
}
addEventListener('resize',fit); fit();
updateBadge();
go('welcome',{}, {reset:true});
</script>
